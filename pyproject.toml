[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-toybox"
version = "1.0.0"
description = "Minimal monorepo for toy RL arcade games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "arcade>=3.3.3",
  "numpy>=1.24",
  "pillow>=10",
  "pyglet>=2.0",
  "torch>=2.2",
]

[project.scripts]
rl-toybox-train = "scripts.train:main"
rl-toybox-play-ai = "scripts.play_ai:main"
rl-toybox-play-user = "scripts.play_user:main"
rl-toybox-env-sanity = "scripts.env_sanity:main"
rl-toybox-capture-demo = "scripts.capture_demo:main"

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["assets*", "core*", "games*", "scripts*"]

[tool.setuptools.package-data]
"assets" = ["fonts/*", "audio/*", "icons/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F"]
