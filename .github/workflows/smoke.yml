name: Smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYGLET_HEADLESS: "true"
      RL_TOYBOX_RENDER_VISIBLE: "0"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install headless graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dri libgles2

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run env sanity smoke test
        timeout-minutes: 5
        run: rl-toybox-env-sanity
